name = "ens-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-10"

[observability]
enabled = true

[vars]
# Writes are restricted to direct subnames of this. Reads are not restricted,
# so the gateway can still serve any name whose resolver points at it.
PARENT_NAME = "offchaindemo.eth"

[[d1_databases]]
binding = "DB"
database_name = "offchaindemo"
database_id = "6b30bc65-edda-4e25-bb5a-8681b0419031"

# The necessary secrets are:
# - PRIVATE_KEY
# Run `echo <VALUE> | wrangler secret put <NAME>` for each of these
